<style id="css">
/* Layout: a single readable column — today up top, then one strip per day, like a note on the fridge */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#15302c; --muted:#5d716d; --line:#d8e2df;
  --accent:#0f6b5c; --accent-soft:#dcefe9; --sun:#f5c94a; --sun-ink:#4a3a00;
  --nana:#8a3f8f; --nana-soft:#f3e4f4; --kaleb:#1f5fa8; --kaleb-soft:#e1ecf9;
  --judah:#b4561c; --judah-soft:#fbe9dc;
  --bin-green:#7cb342; --bin-green-ink:#1b2e05; --bin-red:#c62828;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --ink:#e4eeeb; --muted:#9bb0ab; --line:#2a3a37;
  --accent:#5cc5ae; --accent-soft:#1b3631; --sun:#e8bd3f; --sun-ink:#2a2000;
  --nana:#e0a3e4; --nana-soft:#352339; --kaleb:#8dbaf0; --kaleb-soft:#1c2c42;
  --judah:#f2a36d; --judah-soft:#3a271a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --ink:#e4eeeb; --muted:#9bb0ab; --line:#2a3a37;
  --accent:#5cc5ae; --accent-soft:#1b3631; --sun:#e8bd3f; --sun-ink:#2a2000;
  --nana:#e0a3e4; --nana-soft:#352339; --kaleb:#8dbaf0; --kaleb-soft:#1c2c42;
  --judah:#f2a36d; --judah-soft:#3a271a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.progress{display:flex;gap:4px;margin-top:8px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--sun)}

.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tile{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.tile .v{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.15}
.tile .s{font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;opacity:.9}
.btn:focus-visible,.item:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.spacer{flex:1}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--judah);color:var(--judah)}

.days{display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.day.past{opacity:.55}
.day.is-today{border:2px solid var(--sun);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.dhead{display:flex;align-items:baseline;gap:8px;padding:12px 16px 4px}
.dhead h3{font-size:20px;font-weight:800}
.dhead .mo{color:var(--muted);font-size:14px}
.badge{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--sun);color:var(--sun-ink)}
.badge.home{background:var(--accent-soft);color:var(--accent)}
.chore{margin:6px 16px 0;padding:6px 10px;border-radius:8px;background:var(--sun);color:var(--sun-ink);font-size:14px;font-weight:700}
.list{display:flex;flex-direction:column;padding:4px 16px 10px;min-width:0}
.list:empty{display:none}
.item{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;background:none;border:0;padding:8px 0;text-align:left;font:inherit;color:inherit;width:100%;border-top:1px dashed var(--line)}
.list .item:first-child{border-top:0}
.editing .item{cursor:pointer;border-radius:8px}
.editing .item:hover{background:var(--accent-soft)}
.time{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;padding-top:1px}
.time .to{display:block;font-weight:400;color:var(--muted);font-size:13px}
.time.any{color:var(--muted);font-weight:400}
.what{min-width:0}
.what .t{font-weight:700;font-size:16px}
.what .n{font-size:14px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--ink)}
.tag.Nana{background:var(--nana-soft);color:var(--nana)}
.tag.Kaleb{background:var(--kaleb-soft);color:var(--kaleb)}
.tag.Judah{background:var(--judah-soft);color:var(--judah)}
.lift{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:var(--surface);background:var(--ink)}
.lift.Nana{background:var(--nana)}
.lift.Kaleb{background:var(--kaleb)}
.dinnerrow{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:baseline;padding:10px 16px;background:var(--accent-soft);margin-top:auto}
.dinnerrow .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.dinnerrow .v{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);line-height:1.2}
.dinnerrow .v.none{font-family:var(--body);font-size:15px;font-weight:400;font-style:italic;color:var(--muted)}
.chore.item{display:block;width:auto;padding:6px 10px;border-top:0;border-radius:8px;margin:6px 16px 0;background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:14px}
/* calendar */
.calwrap{display:flex;flex-direction:column;gap:10px}
.calhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.calhead h2{font-size:22px;font-weight:800}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{min-height:62px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cell.out{background:transparent;border-style:dashed;cursor:default;color:var(--muted);opacity:.55}
.cell.past{opacity:.6}
.cell.today{border:2px solid var(--sun)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.cell:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.cn{font-family:var(--display);font-weight:800;font-size:16px;line-height:1;font-variant-numeric:tabular-nums}
.cell.today .cn{background:var(--sun);color:var(--sun-ink);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;align-self:flex-start;padding:0 4px}
.full{display:none}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.meal{background:var(--accent)}.dot.Nana{background:var(--nana)}.dot.Kaleb{background:var(--kaleb)}.dot.bin{background:var(--sun)}
.ev{font-size:12px;line-height:1.3;border-radius:6px;padding:3px 6px;background:var(--bg);overflow-wrap:anywhere}
.ev b{display:block;font-variant-numeric:tabular-nums}
.ev em{display:block;font-style:normal;font-weight:700;font-size:11px;opacity:.9}
.ev em.nt{font-weight:400}
.ev.Nana{background:var(--nana);color:var(--surface)}.ev.Kaleb{background:var(--kaleb);color:var(--surface)}
.ev.bin{background:var(--sun);color:var(--sun-ink);font-weight:700}
.ev.bin.green,.chore.item.green{background:var(--bin-green);color:var(--bin-green-ink)}
.ev.bin.red,.chore.item.red{background:var(--bin-red);color:#fff}.dot.bin.red{background:var(--bin-red)}
.dot.bin{border-radius:2px}.dot.bin.green{background:var(--bin-green)}
.cdin{margin-top:auto;border-top:1px dashed var(--line);padding-top:4px;font-family:var(--display);font-weight:700;font-size:13px;line-height:1.2;color:var(--accent);overflow-wrap:anywhere}
.cdin small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cdin.none{color:var(--muted);font-weight:400;font-style:italic}
.detail{max-width:680px;width:100%}
@media (min-width:760px){.wrap:not(.editing) .detail{display:none}.cell{min-height:160px;padding:8px}.full{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.dots{display:none}.legend .dotonly{display:none}}
.dinnerrow.item{border-top:0;border-radius:0;padding:10px 16px}
.empty{color:var(--muted);font-size:14px;font-style:italic;padding:4px 0}
.add{font:inherit;font-size:13px;color:var(--accent);background:none;border:1px dashed var(--accent);border-radius:8px;padding:4px 10px;cursor:pointer;align-self:start;margin-top:6px}

.panel{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.15);
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));z-index:20;max-height:85vh;overflow:auto}
.panel form{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel h3{grid-column:1/-1;font-size:20px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.panel .full{grid-column:1/-1}
.panel input,.panel select{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.panel .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.savebar .btn{background:var(--sun-ink);border-color:var(--sun-ink);color:var(--sun)}
.foot{font-size:13px;color:var(--muted)}
@media (max-width:420px){.day{grid-template-columns:52px 1fr;gap:10px}.item{grid-template-columns:46px 1fr}.panel form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.item{transition:background .15s}}

    if(d<S.tripStart||d>S.tripEnd){cells+=`<div class="cell out" aria-hidden="true"><span class="cn">${p.dn}</span></div>`;continue;}
    const its=itemsFor(d),meal=its.find(i=>i.kind==='meal');
    const full=its.filter(i=>i.kind==='chore').map(i=>`<span class="ev bin ${binc(i)}">${esc(i.title)}</span>`).join('')+
      its.filter(i=>i.kind==='activity'||i.kind==='note').map(i=>`<span class="ev ${esc(i.driver||'')}">${i.start?`<b>${fmt(i.start)}</b>`:''}${i.who?esc(i.who)+' · ':''}${esc(i.title)}${i.driver?`<em>${esc(i.driver)} drives</em>`:''}${i.note?`<em class="nt">${esc(i.note)}</em>`:''}</span>`).join('')+
      `<span class="cdin ${meal?'':'none'}"><small>Dinner</small>${meal?esc(meal.title):'Not planned'}</span>`;
    const dots=(meal?'<i class="dot meal"></i>':'')+its.filter(i=>i.kind==='chore').map(i=>`<i class="dot bin ${binc(i)}"></i>`).join('')+
      its.filter(i=>i.kind==='activity'||i.kind==='note').map(i=>`<i class="dot ${i.driver?esc(i.driver):'act'}"></i>`).join('');
    cells+=`<button type="button" class="cell ${d<today?'past':''} ${d===today?'today':''} ${d===selected?'sel':''}" data-sel="${d}" aria-pressed="${d===selected}" aria-label="${p.dow} ${p.dn} ${p.mo}">
      <span class="cn">${p.dn}</span><span class="full">${full}</span><span class="dots">${dots}</span></button>`;}
  const cal=`<section class="calwrap" aria-label="Calendar"><div class="calhead"><h2>November</h2>
    <div class="legend"><span><i class="dot meal"></i>Dinner</span><span><i class="dot Nana"></i>Nana drives</span><span><i class="dot Kaleb"></i>Kaleb drives</span><span><i class="dot act"></i>Other plans</span><span><i class="dot bin"></i><i class="dot bin red"></i>Bin day</span></div></div>
    <div class="cal">${heads.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div></section>`;
  const detail=dayCard(selected,today);
  app.className='wrap'+(editing?' editing':'');
  app.innerHTML=`<header><div class="eyebrow">While Mum &amp; Dad are in Vancouver</div>
    <div class="hrow"><h1>Boys' Home Plan</h1>${canEdit?`<button type="button" class="btn ${editing?'':'ghost'}" id="editBtn">${editing?'Done editing':'Edit plan'}</button>`:''}</div>
    <p class="sub">${parts(S.tripStart).dn}–${parts(S.tripEnd).dn} Nov · ${status}</p></header>
    ${summary}
    ${cal}
    <div class="detail">${detail}</div>
    ${dirty||msg?`<div class="savebar" role="status"><span>${esc(msg||'Unsaved changes')}</span><span class="spacer"></span>${dirty?'<button type="button" class="btn" id="saveBtn">Save for everyone</button>':''}</div>`:''}
    <p class="foot">${S.updated?'Last updated '+esc(S.updated)+'. ':''}Times are Queensland time.</p>`;
}
function openPanel(item,date){
  const it=item||{id:'n'+Date.now().toString(36),date,kind:'activity',title:''};
  panel?.remove();panel=document.createElement('div');panel.className='panel';
  const opt=(v,cur,l)=>`<option value="${v}"${v===(cur||'')?' selected':''}>${l||v||'—'}</option>`;
  panel.innerHTML=`<form id="itemForm"><h3>${item?'Edit':'Add'} item</h3>
    <label>Day<select id="f-date">${days().map(d=>{const p=parts(d);return opt(d,it.date,`${p.dow} ${p.dn} ${p.mo}`)}).join('')}</select></label>
    <label>Type<select id="f-kind">${opt('meal',it.kind,'Dinner')}${opt('activity',it.kind,'Activity')}${opt('chore',it.kind,'Chore')}</select></label>
    <label class="full">What<input id="f-title" required value="${esc(it.title)}" placeholder="e.g. Bytes"></label>
    <label>Start<input id="f-start" type="time" value="${esc(it.start||'')}"></label>
    <label>End<input id="f-end" type="time" value="${esc(it.end||'')}"></label>
    <label>Who<select id="f-who">${['','Judah','Kaleb','Both boys'].map(v=>opt(v,it.who)).join('')}</select></label>
    <label>Driver<select id="f-driver">${['','Nana','Kaleb'].map(v=>opt(v,it.driver)).join('')}</select></label>
    <label class="full">Note<input id="f-note" value="${esc(it.note||'')}"></label>
    <div class="row"><button class="btn" type="submit">Apply</button><button class="btn ghost" type="button" id="f-cancel">Cancel</button>
    ${item?'<span class="spacer"></span><button class="btn danger" type="button" id="f-del">Delete</button>':''}</div></form>`;
  document.body.appendChild(panel);panel.querySelector('#f-title').focus();
  panel.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const g=id=>panel.querySelector(id).value.trim();
    const n={id:it.id,date:g('#f-date'),kind:g('#f-kind'),title:g('#f-title')};
    for(const[k,s]of[['start','#f-start'],['end','#f-end'],['who','#f-who'],['driver','#f-driver'],['note','#f-note']]){const v=g(s);if(v)n[k]=v;}
    S.items=S.items.filter(x=>x.id!==it.id).concat(n);close(true);});
  panel.querySelector('#f-cancel').onclick=()=>close(false);
  const del=panel.querySelector('#f-del');if(del)del.onclick=()=>{S.items=S.items.filter(x=>x.id!==it.id);close(true);};
  function close(changed){panel.remove();panel=null;if(changed){dirty=true;msg='';}render();}
}
function buildDoc(){
  const st=JSON.stringify(S).replace(/</g,'\\u003c');
  const fontLinks=[...document.querySelectorAll('link[rel="preconnect"],link[rel="stylesheet"]')].map(l=>l.outerHTML).join('\n');
  return SKEL_HEAD+SKEL_RESET+'</style></head><body>'+
   "<title>Boys' Home Plan</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n"+fontLinks+
   '\n<style id="css">'+SRC.css+'</style>\n<div id="app" class="wrap"></div>\n<script type="application/json" id="state">'+st+'<\/script>\n<script id="appjs">'+SRC.js+'<\/script></body></html>';
}
async function save(){
  if(!art)return;const b=document.getElementById('saveBtn');if(b){b.disabled=true;b.textContent='Saving…';}
  const d=new Date(Date.now()+10*3600e3);S.updated=`${parts(d.toISOString().slice(0,10)).dow} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${fmt(d.toISOString().slice(11,16))}`;
  try{await art.publish(buildDoc());dirty=false;msg='Saved';}
  catch(e){if(e&&e.code==='conflict'){msg='Someone else saved first — the page will reload with their version.';dirty=false;}
    else if(e&&(e.code==='not_granted'||e.code==='not_writer')){msg='You can view this plan but not change it.';canEdit=false;editing=false;dirty=false;}
    else msg='Couldn’t save just now. Try again in a minute.';}
  render();
}
app.addEventListener('click',e=>{
  const sc=e.target.closest('[data-sel]');if(sc){selected=sc.dataset.sel;render();if(matchMedia('(max-width:759px)').matches)document.querySelector('.detail')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});return;}
  if(e.target.closest('#editBtn')){editing=!editing;render();return;}
  if(e.target.closest('#saveBtn')){save();return;}
  const a=e.target.closest('[data-add]');if(a){openPanel(null,a.dataset.add);return;}
  const it=editing&&e.target.closest('.item');if(it){openPanel(S.items.find(x=>x.id===it.dataset.id));}
});
render();setInterval(()=>{if(!panel)render();},60e3);
(async()=>{try{const [a,u]=await Promise.all([window.claude?.use?.('artifact'),window.claude?.use?.('user')]);
  art=a;canEdit=!!a&&(u?await u.canEdit():false);if(canEdit)render();}catch(_){}})();
})();
</script>
